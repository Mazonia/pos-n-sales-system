name: Build & Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Windows Executable (.exe Installer & Portable)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Bundle
        run: npm run build

      - name: Build Windows .exe Installer & Portable
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: release/*.exe

  # -------------------------------------------------------------
  # 2. macOS Desktop (.dmg Universal)
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Bundle
        run: npm run build

      - name: Build macOS .dmg & .zip
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            release/*.dmg
            release/*.zip

  # -------------------------------------------------------------
  # 3. Android Tablet (.apk)
  # -------------------------------------------------------------
  build-android:
    name: Build Android Tablet (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set Android Environment & Accept Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Bundle & Sync Capacitor Android
        run: |
          npm run build
          npm run cap:sync:android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/AkwaabaPOS-Tablet-Debug.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-android/AkwaabaPOS-Tablet-Debug.apk

  # -------------------------------------------------------------
  # 4. Web Application Archive (.zip)
  # -------------------------------------------------------------
  build-web:
    name: Build Web App Archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Bundle
        run: npm run build

      - name: Compress Web Archive
        run: |
          cd dist
          zip -r ../AkwaabaPOS-Web-Build.zip .
          cd ..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: AkwaabaPOS-Web-Build.zip

  # -------------------------------------------------------------
  # 5. Create GitHub Release & Attach Binaries
  # -------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-android, build-web]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Organize Release Files
        run: |
          mkdir -p final-release
          find release-assets -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.apk" -o -name "*.zip" \) -exec cp {} final-release/ \; || true
          ls -la final-release

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          gh release upload v1.0.0 final-release/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
