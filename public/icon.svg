<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131B" />
      <stop offset="50%" stop-color="#080B0F" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>

    <!-- Vibrant Primary Sunset Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="35%" stop-color="#FF6D00" />
      <stop offset="70%" stop-color="#FF9E00" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Subtle Teal Accent for Financial Balance -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CED1" />
      <stop offset="100%" stop-color="#008B8B" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  
  <!-- Outer Rim Accent -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#1E2735" stroke-width="2.5" opacity="0.8" />
  
  <!-- Ambient Inner Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#flameGrad)" stroke-width="1.5" opacity="0.15" />

  <!-- Main Symbol Group with Shadow -->
  <g filter="url(#subtleDrop)">
    
    <!-- Central Akwaaba Arch / Gateway & POS Chevron Motif -->
    <!-- Left Sweeping Flame Wing (Welcome Arc) -->
    <path d="M 148 356 C 148 244 204 156 256 120 C 236 172 230 224 238 276 C 242 302 236 328 214 346 C 196 360 170 366 148 356 Z" 
          fill="url(#flameGrad)" />

    <!-- Right Sweeping Flame Wing (Commerce & Prosperity Arc) -->
    <path d="M 364 356 C 364 244 308 156 256 120 C 276 172 282 224 274 276 C 270 302 276 328 298 346 C 316 360 342 366 364 356 Z" 
          fill="url(#goldGrad)" />

    <!-- Radiant Inner Core / Retail Pillar (The Hearth of the Shop) -->
    <path d="M 256 168 L 278 226 L 256 252 L 234 226 Z" 
          fill="#FFF7ED" 
          filter="url(#coreGlow)" />

    <!-- Lower Horizon Till Line & Secure Vault Arch -->
    <path d="M 180 376 Q 256 394 332 376 C 342 374 348 382 344 390 C 330 412 296 426 256 426 C 216 426 182 412 168 390 C 164 382 170 374 180 376 Z" 
          fill="url(#flameGrad)" />

    <!-- Golden Star of Ghana at Apex -->
    <g transform="translate(256, 108)">
      <polygon points="0,-24 7,-7 25,-7 11,4 16,21 0,11 -16,21 -11,4 -25,-7 -7,-7" 
               fill="url(#goldGrad)" />
    </g>

    <!-- Subtle Modernist Tech Dot Accent (Teal / Integrity) -->
    <circle cx="256" cy="318" r="8" fill="url(#tealGrad)" />
  </g>
</svg>
